[project]
name = "solidcraft-ai-studio"
version = "0.1.0"
description = "Tablet-Oberfläche mit Stift und KI-Agent für SolidCraft"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10"]

[project.scripts]
solidcraft-studio = "studio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
